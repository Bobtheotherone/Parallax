[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-raytracer"
version = "0.1.0"
description = "An original, inspectable CPU raytracer and deterministic studio showcase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.scripts]
parallax-raytracer = "parallax_raytracer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
