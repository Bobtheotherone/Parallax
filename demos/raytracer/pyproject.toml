[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-raytracer"
version = "0.2.0"
description = "Original CPU and live GPU raytracers with a deterministic studio showcase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
live = ["moderngl>=5.12", "glfw>=2.8"]

[project.scripts]
parallax-raytracer = "parallax_raytracer.cli:main"
parallax-raytracer-live = "parallax_raytracer.live:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parallax_raytracer = ["shaders/*.glsl"]
