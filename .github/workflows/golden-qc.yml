name: Golden integration QC

on:
  push:
    branches:
      - integration/golden-unified-qc

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Recover exact source members and build honest recovery archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import binascii
          import hashlib
          import json
          import struct
          import subprocess
          import zipfile
          import zlib

          archive = Path('docs/provenance/adaptive-representations-source.zip')
          inventory_path = Path('docs/provenance/source-inventory.json')
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          archive_info = inventory['archive']
          historical_container_sha = archive_info['sha256']
          prefix = archive_info['source_prefix']
          rows = inventory['sources']
          expected_by_hash = {row['sha256']: row for row in rows}
          recovered: dict[str, bytes] = {}

          raw = archive.read_bytes()
          published_corrupt_sha = hashlib.sha256(raw).hexdigest()
          print('published_archive_size', len(raw))
          print('published_archive_sha256', published_corrupt_sha)
          print('declared_historical_archive_sha256', historical_container_sha)

          # Salvage complete local records from the damaged published container.
          pos = 0
          while pos + 30 <= len(raw) and raw[pos:pos + 4] == b'PK\x03\x04':
              (sig, needed, flags, method, mtime, mdate, crc, csize, usize,
               name_len, extra_len) = struct.unpack_from('<IHHHHHIIIHH', raw, pos)
              name_start = pos + 30
              name = raw[name_start:name_start + name_len].decode('utf-8')
              data_start = name_start + name_len + extra_len
              compressed = raw[data_start:data_start + csize]
              if flags & 0x08 or len(compressed) != csize:
                  print('archive_truncation_reached_at', name)
                  break
              if method == 8:
                  data = zlib.decompress(compressed, -15)
              elif method == 0:
                  data = compressed
              else:
                  raise AssertionError(f'unsupported compression method {method} for {name}')
              assert len(data) == usize
              assert (binascii.crc32(data) & 0xffffffff) == crc
              digest = hashlib.sha256(data).hexdigest()
              relative = name[len(prefix):] if name.startswith(prefix) else None
              row = expected_by_hash.get(digest)
              if relative and row is not None:
                  assert row['source_path'] == relative
                  assert row['bytes'] == len(data)
                  recovered[relative] = data
              pos = data_start + csize

          # Search every historical Git blob reachable from every fetched ref.
          object_ids = []
          seen = set()
          for line in subprocess.check_output(['git', 'rev-list', '--objects', '--all'], text=True).splitlines():
              oid = line.split(' ', 1)[0]
              if oid not in seen:
                  seen.add(oid)
                  object_ids.append(oid)
          for oid in object_ids:
              if subprocess.check_output(['git', 'cat-file', '-t', oid], text=True).strip() != 'blob':
                  continue
              data = subprocess.check_output(['git', 'cat-file', 'blob', oid])
              row = expected_by_hash.get(hashlib.sha256(data).hexdigest())
              if row is not None:
                  assert row['bytes'] == len(data)
                  recovered[row['source_path']] = data

          missing = [row['source_path'] for row in rows if row['source_path'] not in recovered]
          print('exact_original_sources_recovered', len(recovered), 'of', len(rows))
          print('unrecoverable_original_sources', len(missing))
          for name in missing:
              print('  -', name)

          # Preserve exactly what is knowable. RECOVERY.md is new recovery metadata,
          # not a replacement source file and not counted as part of the 36-source corpus.
          recovery_lines = [
              '# Source archive recovery',
              '',
              'The source archive originally intended for publication was truncated in the',
              'Git blob. This recovery container preserves every original source file whose',
              'exact bytes can be independently recovered from surviving ZIP records or Git',
              'history. Missing originals are listed by their previously recorded identity;',
              'no bytes are fabricated to satisfy those hashes.',
              '',
              f'- Historical intended archive SHA-256: `{historical_container_sha}`',
              f'- Published truncated blob SHA-256: `{published_corrupt_sha}`',
              f'- Exact original source files recovered: **{len(recovered)} / {len(rows)}**',
              '',
              '## Unavailable original source bytes',
              '',
              '| Path | Bytes | Recorded SHA-256 |',
              '|---|---:|---|',
          ]
          for name in missing:
              row = next(row for row in rows if row['source_path'] == name)
              recovery_lines.append(f"| `{name}` | {row['bytes']} | `{row['sha256']}` |")
          recovery_text = '\n'.join(recovery_lines) + '\n'

          repaired = Path('/tmp/adaptive-representations-source.recovered.zip')
          with zipfile.ZipFile(repaired, 'w', compression=zipfile.ZIP_DEFLATED,
                               compresslevel=9, strict_timestamps=True) as zf:
              for row in rows:
                  if row['source_path'] not in recovered:
                      continue
                  info = zipfile.ZipInfo(prefix + row['source_path'], date_time=(2026, 9, 5, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, recovered[row['source_path']], compress_type=zipfile.ZIP_DEFLATED,
                              compresslevel=9)
              info = zipfile.ZipInfo(prefix + 'RECOVERY.md', date_time=(2026, 9, 5, 0, 0, 0))
              info.compress_type = zipfile.ZIP_DEFLATED
              info.create_system = 3
              info.external_attr = 0o100644 << 16
              zf.writestr(info, recovery_text.encode('utf-8'), compress_type=zipfile.ZIP_DEFLATED,
                          compresslevel=9)

          repaired_bytes = repaired.read_bytes()
          repaired_sha = hashlib.sha256(repaired_bytes).hexdigest()
          print('recovery_archive_size', len(repaired_bytes))
          print('recovery_archive_sha256', repaired_sha)

          # Validate every available historical payload before using the container.
          with zipfile.ZipFile(repaired) as zf:
              for row in rows:
                  if row['source_path'] in missing:
                      continue
                  data = zf.read(prefix + row['source_path'])
                  assert len(data) == row['bytes']
                  assert hashlib.sha256(data).hexdigest() == row['sha256']
              recovery = zf.read(prefix + 'RECOVERY.md').decode('utf-8')
              for name in missing:
                  row = next(row for row in rows if row['source_path'] == name)
                  assert name in recovery and row['sha256'] in recovery and str(row['bytes']) in recovery

          # Substitute the prospective repaired state for the rest of this QC run.
          archive.write_bytes(repaired_bytes)
          archive_info['historical_declared_sha256'] = historical_container_sha
          archive_info['published_corrupt_sha256'] = published_corrupt_sha
          archive_info['status'] = 'partial-recovery'
          archive_info['recovered_source_count'] = len(recovered)
          archive_info['unrecoverable_sources'] = missing
          archive_info['sha256'] = repaired_sha
          inventory_path.write_text(json.dumps(inventory, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Preserve repaired provenance state for repository commit
        uses: actions/upload-artifact@v4
        with:
          name: recovered-source-archive
          path: |
            docs/provenance/adaptive-representations-source.zip
            docs/provenance/source-inventory.json
          if-no-files-found: error
          retention-days: 1

      - name: Documentation integrity
        run: python tools/check_docs.py

      - name: Documentation checker regressions
        run: python -m unittest discover -s tools -p 'test_check_docs.py' -v

      - name: Golden diff whitespace check
        run: git diff --check 00c3821b4b812a7e61e24968053059c7adabea30..HEAD

      - name: Preserved intseq reference smoke test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import subprocess
          import sys
          import tempfile

          text = Path('runtime/REFERENCE.md').read_text(encoding='utf-8')
          blocks = re.findall(r'^```python[ \t]*\n(.*?)^```[ \t]*$', text, re.MULTILINE | re.DOTALL)
          assert len(blocks) == 1, len(blocks)
          code = blocks[0]
          expected = '4025a0043e958785196e35d6530ec4570dcedd36cf621b555249a1809649dc91'
          assert hashlib.sha256(code.encode('utf-8')).hexdigest() == expected

          path = Path(tempfile.mkdtemp(prefix='parallax-golden-qc-')) / 'reference.py'
          path.write_text(code, encoding='utf-8')

          selftest = subprocess.run(
              [sys.executable, str(path), '--selftest'],
              check=True, capture_output=True, text=True,
          )
          selftest_report = json.loads(selftest.stdout)
          assert selftest_report['status'] == 'PASS', selftest_report

          evaluated = subprocess.run(
              [
                  sys.executable, str(path),
                  '--capsule', 'examples/intseq/CAPSULE.md',
                  '--program', 'examples/intseq/PROGRAM.md',
                  '--input', '[-2,-1,0,2]',
              ],
              check=True, capture_output=True, text=True,
          )
          report = json.loads(evaluated.stdout)
          assert report['status'] == 'EVALUATED', report
          assert report['value'] == 16, report
          assert report['task_correctness'] == 'NOT_CHECKED', report
          PY
