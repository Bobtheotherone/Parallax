name: Golden integration QC

on:
  push:
    branches:
      - integration/golden-unified-qc

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Recover exact source members from Git history and surviving ZIP records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import binascii
          import hashlib
          import json
          import struct
          import subprocess
          import zipfile
          import zlib

          archive = Path('docs/provenance/adaptive-representations-source.zip')
          inventory_path = Path('docs/provenance/source-inventory.json')
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          historical_container_sha = inventory['archive']['sha256']
          prefix = inventory['archive']['source_prefix']
          rows = inventory['sources']
          expected_by_hash = {row['sha256']: row for row in rows}
          recovered: dict[str, bytes] = {}

          raw = archive.read_bytes()
          print('published_archive_size', len(raw))
          print('published_archive_sha256', hashlib.sha256(raw).hexdigest())
          print('declared_historical_archive_sha256', historical_container_sha)

          # First salvage every complete local record from the damaged container.
          pos = 0
          complete_zip_members = 0
          while pos + 30 <= len(raw) and raw[pos:pos + 4] == b'PK\x03\x04':
              (sig, needed, flags, method, mtime, mdate, crc, csize, usize,
               name_len, extra_len) = struct.unpack_from('<IHHHHHIIIHH', raw, pos)
              name_start = pos + 30
              name_bytes = raw[name_start:name_start + name_len]
              name = name_bytes.decode('utf-8')
              data_start = name_start + name_len + extra_len
              compressed = raw[data_start:data_start + csize]
              if flags & 0x08:
                  print('unsupported_data_descriptor_at', name)
                  break
              if len(compressed) != csize:
                  print('truncated_member', name, 'needed_compressed', csize,
                        'available', len(compressed))
                  break
              if method == 8:
                  data = zlib.decompress(compressed, -15)
              elif method == 0:
                  data = compressed
              else:
                  raise AssertionError(f'unsupported compression method {method} for {name}')
              assert len(data) == usize
              assert (binascii.crc32(data) & 0xffffffff) == crc
              digest = hashlib.sha256(data).hexdigest()
              relative = name[len(prefix):] if name.startswith(prefix) else None
              if relative and digest in expected_by_hash:
                  row = expected_by_hash[digest]
                  assert row['source_path'] == relative
                  assert row['bytes'] == len(data)
                  recovered[relative] = data
              complete_zip_members += 1
              pos = data_start + csize
          print('complete_zip_members_recovered', complete_zip_members)

          # Then search every Git blob reachable from every fetched ref. This recovers
          # exact historical source bytes independently of current rewritten paths.
          object_lines = subprocess.check_output(
              ['git', 'rev-list', '--objects', '--all'], text=True
          ).splitlines()
          object_ids = []
          seen = set()
          for line in object_lines:
              oid = line.split(' ', 1)[0]
              if oid not in seen:
                  seen.add(oid)
                  object_ids.append(oid)

          git_matches = 0
          for oid in object_ids:
              kind = subprocess.check_output(['git', 'cat-file', '-t', oid], text=True).strip()
              if kind != 'blob':
                  continue
              data = subprocess.check_output(['git', 'cat-file', 'blob', oid])
              digest = hashlib.sha256(data).hexdigest()
              row = expected_by_hash.get(digest)
              if row is None:
                  continue
              assert row['bytes'] == len(data)
              if row['source_path'] not in recovered:
                  git_matches += 1
              recovered[row['source_path']] = data
          print('additional_exact_git_blob_matches', git_matches)
          print('total_exact_source_members_recovered', len(recovered), 'of', len(rows))

          missing = [row['source_path'] for row in rows if row['source_path'] not in recovered]
          if missing:
              print('missing_exact_sources')
              for name in missing:
                  print('  -', name)
              raise AssertionError(f'{len(missing)} original source files are not recoverable from Git history or complete ZIP records')

          # Rebuild a deterministic, valid archival container from the exact original
          # members. Source identities remain unchanged; only the damaged container is
          # replaced. The repository inventory will be updated to the repaired container
          # SHA after this artifact is committed.
          repaired = Path('/tmp/adaptive-representations-source.repaired.zip')
          with zipfile.ZipFile(repaired, 'w', compression=zipfile.ZIP_DEFLATED,
                               compresslevel=9, strict_timestamps=True) as zf:
              for row in rows:
                  info = zipfile.ZipInfo(prefix + row['source_path'], date_time=(2026, 9, 5, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, recovered[row['source_path']], compress_type=zipfile.ZIP_DEFLATED,
                              compresslevel=9)

          repaired_bytes = repaired.read_bytes()
          repaired_sha = hashlib.sha256(repaired_bytes).hexdigest()
          print('repaired_archive_size', len(repaired_bytes))
          print('repaired_archive_sha256', repaired_sha)
          assert zipfile.is_zipfile(repaired)

          # Validate all rebuilt members against the authoritative per-source inventory.
          with zipfile.ZipFile(repaired) as zf:
              names = zf.namelist()
              assert names == [prefix + row['source_path'] for row in rows]
              for row in rows:
                  data = zf.read(prefix + row['source_path'])
                  assert len(data) == row['bytes']
                  assert hashlib.sha256(data).hexdigest() == row['sha256']

          # For this QC run only, substitute the repaired archive and matching active
          # container hash so downstream checks exercise the prospective repaired state.
          archive.write_bytes(repaired_bytes)
          inventory['archive']['sha256'] = repaired_sha
          inventory_path.write_text(json.dumps(inventory, indent=2) + '\n', encoding='utf-8')
          Path('/tmp/repaired-archive-sha256.txt').write_text(repaired_sha + '\n', encoding='ascii')
          PY

      - name: Preserve recovered archive for repository repair
        uses: actions/upload-artifact@v4
        with:
          name: recovered-source-archive
          path: |
            docs/provenance/adaptive-representations-source.zip
            /tmp/repaired-archive-sha256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Documentation integrity
        run: python tools/check_docs.py

      - name: Documentation checker regressions
        run: python -m unittest discover -s tools -p 'test_check_docs.py' -v

      - name: Golden diff whitespace check
        run: git diff --check 00c3821b4b812a7e61e24968053059c7adabea30..HEAD

      - name: Preserved intseq reference smoke test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import subprocess
          import sys
          import tempfile

          text = Path('runtime/REFERENCE.md').read_text(encoding='utf-8')
          blocks = re.findall(r'^```python[ \t]*\n(.*?)^```[ \t]*$', text, re.MULTILINE | re.DOTALL)
          assert len(blocks) == 1, len(blocks)
          code = blocks[0]
          expected = '4025a0043e958785196e35d6530ec4570dcedd36cf621b555249a1809649dc91'
          assert hashlib.sha256(code.encode('utf-8')).hexdigest() == expected

          path = Path(tempfile.mkdtemp(prefix='parallax-golden-qc-')) / 'reference.py'
          path.write_text(code, encoding='utf-8')

          selftest = subprocess.run(
              [sys.executable, str(path), '--selftest'],
              check=True, capture_output=True, text=True,
          )
          selftest_report = json.loads(selftest.stdout)
          assert selftest_report['status'] == 'PASS', selftest_report

          evaluated = subprocess.run(
              [
                  sys.executable, str(path),
                  '--capsule', 'examples/intseq/CAPSULE.md',
                  '--program', 'examples/intseq/PROGRAM.md',
                  '--input', '[-2,-1,0,2]',
              ],
              check=True, capture_output=True, text=True,
          )
          report = json.loads(evaluated.stdout)
          assert report['status'] == 'EVALUATED', report
          assert report['value'] == 16, report
          assert report['task_correctness'] == 'NOT_CHECKED', report
          PY
