name: Raytracer control verification

on:
  push:
    branches: [demo/raytracer-control]
    paths: ['demos/raytracer/**', '.github/workflows/raytracer-control.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/demo/raytracer-control'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install and verify the renderer
        run: |
          python -m pip install "setuptools>=77" "Pillow>=10"
          python -m pip install --no-build-isolation -e ./demos/raytracer
          python -m parallax_raytracer --help
          parallax-raytracer --help
          python -m unittest discover -s demos/raytracer/tests -v
          python -m parallax_raytracer --width 96 --height 60 --samples 4 --workers 2 --output ./demos/raytracer/render-ci.png --quiet
          python demos/raytracer/checks.py --image ./demos/raytracer/render-ci.png --width 96 --height 60
      - name: Check unchanged Parallax documentation on the complete checkout
        run: python tools/check_docs.py

  live-smoke:
    if: github.ref == 'refs/heads/demo/raytracer-control'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install software OpenGL smoke-test environment
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Compile and execute live GPU path under Mesa
        run: |
          python -m pip install "setuptools>=77"
          python -m pip install --no-build-isolation -e './demos/raytracer[live]'
          parallax-raytracer-live --help
          xvfb-run -a python -m parallax_raytracer.live --width 640 --height 360 --render-scale 0.5 --max-depth 3 --frames 3 --no-vsync
